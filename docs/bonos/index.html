const dc = (txt, d, good = true) => `${txt} <span class="${cls(d, good)}" style="font-size:10px">${arrow(d)}</span>`;

function mondayOf(d) { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() - (x.getUTCDay() + 6) % 7); return x.toISOString().slice(0, 10); }
function isoWeek(d) { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() - (x.getUTCDay() + 6) % 7 + 3); const t = new Date(Date.UTC(x.getUTCFullYear(), 0, 4)); t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7 + 3); return 1 + Math.round((x - t) / 6048e5); }
const ddmm = d => d.slice(8, 10) + "/" + d.slice(5, 7);
const DOW = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];
const dow = d => DOW[(new Date(d + "T12:00:00Z").getUTCDay() + 6) % 7];
const semLabel = w => "S" + isoWeek(w) + (w >= EN_CURSO ? "*" : "");

const eA = () => ({ dias: new Set(), int: 0, fin: 0, can: 0, ndf: 0, ndac: 0, of: 0, ac: 0, hc: 0, ht: 0 });
const eB = () => ({ dias: 0, conv: 0, v1: 0, v2: 0, paid: 0, costo: 0, viajes: 0, gmv: 0, com: 0 });
const addB = (t, b) => { t.dias++; for (const k of ["conv", "v1", "v2", "paid", "costo", "viajes", "gmv", "com"]) t[k] += b[k]; };

function model() {
  const bonoByDay = new Map(DATA.B.map(b => [b.dt, b]));
  const hr = st.hora === "all" ? null : +st.hora, zi = st.zona === "all" ? null : +st.zona;
  const incl = d => d < INICIO ? true : bonoByDay.has(d) && (st.enCurso || d < EN_CURSO);
  const per = d => d < INICIO ? "baseline" : mondayOf(d);
  const P = new Map(), D = new Map(), ZP = new Map(), ZH = new Map();
  const g = (m, k) => { let a = m.get(k); if (!a) { a = eA(); m.set(k, a); } return a; };
  for (const r of DATA.M) {
    const d = DATA.days[r[0]]; if (hr !== null && r[1] !== hr) continue;
    if (zi === null || r[2] === zi) { const a = g(D, d); a.dias.add(d); a.int += r[3]; a.fin += r[4]; a.can += r[5]; a.ndf += r[6]; a.ndac += r[7]; }
    if (!incl(d)) continue;
    const p = per(d), camp = p === "baseline" ? "baseline" : "campana";
    const zp = g(ZP, r[2] + "|" + p); zp.dias.add(d); zp.int += r[3]; zp.fin += r[4];
    const zh = g(ZH, r[2] + "|" + r[1] + "|" + camp); zh.int += r[3]; zh.fin += r[4];
    if (zi !== null && r[2] !== zi) continue;
    for (const k of camp === "campana" ? [p, "campana"] : [p]) { const a = g(P, k); a.dias.add(d); a.int += r[3]; a.fin += r[4]; a.can += r[5]; a.ndf += r[6]; a.ndac += r[7]; }
  }
  for (const r of DATA.A) {
    const d = DATA.days[r[0]]; if (hr !== null && r[1] !== hr) continue;
    if (zi === null || r[2] === zi) { const a = g(D, d); a.of += r[3]; a.ac += r[4]; }
    if (!incl(d)) continue;
    const p = per(d), camp = p === "baseline" ? "baseline" : "campana";
    const zp = g(ZP, r[2] + "|" + p); zp.of += r[3]; zp.ac += r[4];
    if (zi !== null && r[2] !== zi) continue;
    for (const k of camp === "campana" ? [p, "campana"] : [p]) { const a = g(P, k); a.of += r[3]; a.ac += r[4]; }
  }
  for (const r of DATA.H) {
    const d = DATA.days[r[0]]; if (hr !== null && r[1] !== hr) continue;
    const a = g(D, d); a.hc += r[2]; a.ht += r[3];
    if (!incl(d)) continue;
    const p = per(d);
    for (const k of p === "baseline" ? [p] : [p, "campana"]) { const x = g(P, k); x.hc += r[2]; x.ht += r[3]; }
  }
  const BS = new Map(), BT = eB();
  for (const b of DATA.B) {
    if (!st.enCurso && b.dt >= EN_CURSO) continue;
    const w = mondayOf(b.dt); if (!BS.has(w)) BS.set(w, eB()); addB(BS.get(w), b); addB(BT, b);
  }
  const semanas = [...P.keys()].filter(k => k !== "baseline" && k !== "campana").sort();
  return { bonoByDay, P, D, ZP, ZH, BS, BT, semanas };
}

let charts = [];
function chart(id, cfg) { charts.push([id, cfg]); return `<div class="ch${cfg._s ? " s" : ""}"><canvas id="${id}"></canvas></div>`; }
function refLine(label, value, n, color) { return { type: "line", label, data: Array(n).fill(value), borderColor: color, borderDash: [5, 5], borderWidth: 1.5, pointRadius: 0, fill: false }; }
const baseOpts = (suffix = "", extra = {}) => ({
  responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
  plugins: { legend: { labels: { color: "#9aa3b8", boxWidth: 12, font: { size: 11 } } },
    tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y === null ? "—" : fmtN(c.parsed.y, 1)}${suffix}` } } },
  scales: { x: { ticks: { color: "#8892a8", font: { size: 10 } }, grid: { color: "#1c2130" } },
    y: { ticks: { color: "#8892a8", callback: v => fmtN(v) + suffix }, grid: { color: "#1c2130" }, ...extra.y } },
  ...extra.root,
});

function tabla(headers, rows, rowCls = []) {
  return `<div class="tw"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r, i) => `<tr class="${rowCls[i] || ""}">${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const dot = c => `<span class="dot" style="background:${c}"></span>`;

function render() {
  charts.forEach(([id]) => { const c = Chart.getChart(id); if (c) c.destroy(); });
  charts = [];
  const m = model();
  const base = m.P.get("baseline") || eA(), camp = m.P.get("campana") || eA();
  const nB = base.dias.size || 1, nC = camp.dias.size || 1;
  const finB = pct(base.fin, base.int), finC = pct(camp.fin, camp.int), acB = pct(base.ac, base.of), acC = pct(camp.ac, camp.of);
  const demB = base.int / nB, demC = camp.int / nC, htB = base.ht / nB, htC = camp.ht / nC, hcB = base.hc / nB, hcC = camp.hc / nC;
  const bt = m.BT, convTot = pct(bt.paid, bt.conv), roiTot = bt.costo > 0 ? 100 * (bt.com - bt.costo) / bt.costo : NaN;
  const filtro = (st.zona === "all" ? "polígono Core completo" : ZL[+st.zona]) + " · " + (st.hora === "all" ? "16:00–18:59" : st.hora + ":00–" + st.hora + ":59");
  const sem = m.semanas.map(w => {
    const a = m.P.get(w), n = a.dias.size || 1, b = m.BS.get(w) || eB();
    return { w, a, label: semLabel(w), dias: a.dias.size, dem: a.int / n, fin: pct(a.fin, a.int), ac: pct(a.ac, a.of), ht: a.ht / n, hc: a.hc / n, b,
      conv: pct(b.paid, b.conv), roi: b.costo > 0 ? 100 * (b.com - b.costo) / b.costo : NaN };
  });
  const kpi = (v, l, c = "") => `<div class="kc"><div class="kv ${c}">${v}</div><div class="kl">${l}</div></div>`;
  let h = "";

  if (st.tab === "resumen") {
    h += `<div class="call"><b>Lectura rápida</b>En días con bono (${filtro}), la finalización es <b style="display:inline">${fP(finC)}</b> vs ${fP(finB)} en baseline (${fPp(finC - finB)}) y la aceptación ${fP(acC)} vs ${fP(acB)} (${fPp(acC - acB)}). Pero la demanda está ${fD(pct(demC - demB, demB))} y las horas del grupo test ${fD(pct(htC - htB, htB))} vs baseline: la mejora de finalización convive con menos pedidos, no con más oferta. El bono convierte ${fP(convTot)} de los convocados y repaga ${fP(pct(bt.com, bt.costo), 0)} de su costo.</div>`;
    h += `<div class="kg">
      ${kpi(fP(finC), `Finalización días con bono · baseline ${fP(finB)} (${fPp(finC - finB)})`, finC >= finB ? "ok" : "bad")}
      ${kpi(fP(acC), `Aceptación de ofertas · baseline ${fP(acB)} (${fPp(acC - acB)})`, acC >= acB ? "ok" : "bad")}
      ${kpi(fmtN(demC, 1), `Intenciones por día · baseline ${fmtN(demB, 1)} (${fD(pct(demC - demB, demB))})`, demC >= demB ? "ok" : "bad")}
      ${kpi(fmtN(htC, 1) + " h", `Horas/día grupo test 141 en CENTRAL · baseline ${fmtN(htB, 1)} h`, htC >= htB ? "ok" : "bad")}
      ${kpi(fP(convTot), `Conversión del bono · ${fmtN(bt.paid)} PAID / ${fmtN(bt.conv)} convocados-día · mín. 7%`, convTot >= 7 ? "ok" : "bad")}
      ${kpi(fGs(bt.costo), `Costo pagado en ${bt.dias} días con bono`)}
      ${kpi(fGs(bt.com), `Comisión muv de los PAID en zona/ventana · ${fmtN(bt.viajes)} viajes`)}
      ${kpi(fP(roiTot, 0), `ROI contable del bono · repago ${fP(pct(bt.com, bt.costo), 0)}`, roiTot >= 0 ? "ok" : "bad")}</div>`;
    h += `<div class="sec"><h2>Semana a semana vs baseline</h2><div class="cap" style="margin-bottom:8px">Marketplace: ${filtro}, solo días con bono en semanas de campaña. Bono (convocados, PAID, costo, ROI): no depende de los filtros. ▲▼ = mejor o peor que baseline.</div>`;
    h += tabla(["Semana", "Días", "Intenc./día", "Finalización", "Aceptación", "Horas test/día", "Convocados-día", "PAID", "Conversión", "Costo", "Comisión", "ROI"],
      [["Baseline", base.dias.size, fmtN(demB, 1), fP(finB), fP(acB), fmtN(htB, 1), "—", "—", "—", "—", "—", "—"],
       ...sem.map(s => [dot(s.fin >= finB ? C.g : C.r) + s.label + " · " + ddmm(s.w), s.dias, dc(fmtN(s.dem, 1), s.dem - demB), dc(fP(s.fin), s.fin - finB), dc(fP(s.ac), s.ac - acB),
         dc(fmtN(s.ht, 1), s.ht - htB), fmtN(s.b.conv), fmtN(s.b.paid), dc(fP(s.conv), s.conv - 7), fGs(s.b.costo), fGs(s.b.com), `<span class="${cls(s.roi)}">${fP(s.roi, 0)}</span>`])],
      ["base"]);
    if (st.enCurso && HAY_EN_CURSO) h += `<div class="cap">* S${isoWeek(EN_CURSO)} en curso: semana incompleta, no comparable con las cerradas.</div>`;
    h += `</div><div class="g2"><div class="card"><h3>Finalización y aceptación por semana</h3>` + chart("cFA", {
      type: "line", data: { labels: sem.map(s => s.label), datasets: [
        { label: "Finalización (%)", data: sem.map(s => r1(s.fin)), borderColor: C.g, backgroundColor: C.g, tension: .25 },
        { label: "Aceptación (%)", data: sem.map(s => r1(s.ac)), borderColor: C.b, backgroundColor: C.b, tension: .25 },
        refLine("Finalización baseline", r1(finB), sem.length, C.g), refLine("Aceptación baseline", r1(acB), sem.length, C.b)] },
      options: baseOpts("%") }) + `<div class="cap">Eje X: semana · Eje Y: % sobre intenciones (finalización) y sobre ofertas (aceptación) · ${filtro}</div></div>`;
    h += `<div class="card"><h3>Demanda por día y horas del grupo test</h3>` + chart("cDH", {
      type: "bar", data: { labels: sem.map(s => s.label), datasets: [
        { label: "Intenciones por día", data: sem.map(s => r1(s.dem)), backgroundColor: C.n },
        { label: "Horas/día test 141 (CENTRAL)", data: sem.map(s => r1(s.ht)), backgroundColor: C.a },
        refLine("Demanda baseline", r1(demB), sem.length, C.n), refLine("Horas baseline", r1(htB), sem.length, C.a)] },
      options: baseOpts() }) + `<div class="cap">Eje X: semana · Eje Y: intenciones por día en zona/ventana y horas en línea por día del grupo test en CENTRAL 16–19 h.</div></div></div>`;
    const periods = [["Baseline", base], ...sem.map(s => [s.label, s.a])];
    h += `<div class="card sec"><h3>Por qué no terminó la intención</h3>` + chart("cEst", {
      type: "bar", data: { labels: periods.map(p => p[0]), datasets: [
        { label: "Finalizada", data: periods.map(p => r1(pct(p[1].fin, p[1].int))), backgroundColor: C.g },
        { label: "Cancelada", data: periods.map(p => r1(pct(p[1].can, p[1].int))), backgroundColor: C.a },
        { label: "Sin conductor (NDF + no aceptada)", data: periods.map(p => r1(pct(p[1].ndf + p[1].ndac, p[1].int))), backgroundColor: C.r }] },
      options: baseOpts("%", { root: { scales: { x: { stacked: true, ticks: { color: "#8892a8" } }, y: { stacked: true, max: 100, ticks: { color: "#8892a8", callback: v => v + "%" } } } } }) }) +
      `<div class="cap">Estado final de cada intención, % apilado · ${filtro}. "Sin conductor" es la parte que un bono de supply debería reducir.</div></div>`;
  }

  if (st.tab === "diario") {
    const dias = DATA.days.filter(d => { const a = m.D.get(d); return a && a.int > 0; });
    const lab = d => ddmm(d) + (m.bonoByDay.has(d) ? "" : d >= INICIO ? " s/b" : "");
    const L = dias.map(lab), n = dias.length;
    const campStart = dias.findIndex(d => d >= INICIO);
    h += `<div class="sub" style="margin-bottom:14px">Todos los días hábiles del ${ddmm(DATA.days[0])} al ${ddmm(DATA.days[DATA.days.length - 1])} · ${filtro}. "s/b" = día hábil de campaña sin bono. Línea punteada = promedio baseline. Campaña desde ${ddmm(INICIO)} (posición ${campStart + 1}).</div>`;
    h += `<div class="card sec"><h3>Finalización diaria</h3>` + chart("dF", { type: "line", data: { labels: L, datasets: [
      { label: "Finalización (%)", data: dias.map(d => { const a = m.D.get(d); return r1(pct(a.fin, a.int)); }), borderColor: C.g, backgroundColor: C.g, pointRadius: 2.5, tension: .2 },
      refLine("Baseline " + fP(finB), r1(finB), n, C.n)] }, options: baseOpts("%") }) + `<div class="cap">Eje X: día (dd/mm) · Eje Y: intenciones finalizadas / intenciones.</div></div>`;
    h += `<div class="card sec"><h3>Aceptación diaria de ofertas</h3>` + chart("dA", { type: "line", data: { labels: L, datasets: [
      { label: "Aceptación (%)", data: dias.map(d => { const a = m.D.get(d); return r1(pct(a.ac, a.of)); }), borderColor: C.b, backgroundColor: C.b, pointRadius: 2.5, tension: .2 },
      refLine("Baseline " + fP(acB), r1(acB), n, C.n)] }, options: baseOpts("%") }) + `<div class="cap">Eje X: día · Eje Y: ofertas aceptadas / ofertas enviadas.</div></div>`;
    h += `<div class="g2"><div class="card"><h3>Intenciones por día</h3>` + chart("dD", { type: "bar", data: { labels: L, datasets: [
      { label: "Intenciones", data: dias.map(d => m.D.get(d).int), backgroundColor: dias.map(d => d >= INICIO ? C.b : C.n) },
      refLine("Baseline", r1(demB), n, C.a)] }, options: baseOpts() }) + `<div class="cap">Gris = baseline, azul = campaña.</div></div>`;
    h += `<div class="card"><h3>Horas conectadas por día</h3>` + chart("dH", { type: "line", data: { labels: L, datasets: [
      { label: "CENTRAL total (h)", data: dias.map(d => r1(m.D.get(d).hc)), borderColor: C.n, backgroundColor: C.n, pointRadius: 2 },
      { label: "Grupo test 141 (h)", data: dias.map(d => r1(m.D.get(d).ht)), borderColor: C.a, backgroundColor: C.a, pointRadius: 2 }] }, options: baseOpts(" h") }) +
      `<div class="cap">Horas en línea en CENTRAL en la franja elegida. No filtra por zona (la tabla solo trae departamento).</div></div></div>`;
  }

  if (st.tab === "zonas") {
    const Z = [0, 1, 2, 3].map(z => {
      const b = m.ZP.get(z + "|baseline") || eA();
      const ws = m.semanas.map(w => m.ZP.get(z + "|" + w) || eA());
      const c = ws.reduce((t, a) => { t.int += a.int; t.fin += a.fin; t.of += a.of; t.ac += a.ac; return t; }, eA());
      return { z, demB: b.int / nB, demC: c.int / nC, finB: pct(b.fin, b.int), finC: pct(c.fin, c.int), acB: pct(b.ac, b.of), acC: pct(c.ac, c.of), ws };
    });
    h += `<div class="sub" style="margin-bottom:14px">Polígono de campaña desglosado por las zonas Alta Demanda 01, 04 y 05. "Resto polígono" = dentro de la campaña pero fuera de esas tres. El filtro de zona no aplica acá; el de hora sí.</div>`;
    h += `<div class="sec">` + tabla(["Zona", "Intenc./día baseline", "Intenc./día campaña", "Δ demanda", "Finalización baseline", "Finalización campaña", "Δ finalización", "Aceptación baseline", "Aceptación campaña", "Δ aceptación"],
      Z.map(r => [dot(r.finC >= r.finB ? C.g : C.r) + ZL[r.z], fmtN(r.demB, 1), fmtN(r.demC, 1), `<span class="${cls(r.demC - r.demB)}">${fD(pct(r.demC - r.demB, r.demB))}</span>`,
        fP(r.finB), fP(r.finC), `<span class="${cls(r.finC - r.finB)}">${fPp(r.finC - r.finB)}</span>`, fP(r.acB), fP(r.acC), `<span class="${cls(r.acC - r.acB)}">${fPp(r.acC - r.acB)}</span>`])) + `</div>`;
    const zc = [C.g, C.b, C.p];
    h += `<div class="g2 w"><div class="card"><h3>Finalización por zona y semana</h3>` + chart("zF", { type: "line", data: { labels: ["Base", ...m.semanas.map(semLabel)], datasets:
      Z.slice(0, 3).map((r, i) => ({ label: ZL[r.z] + " (%)", data: [r1(r.finB), ...r.ws.map(a => r1(pct(a.fin, a.int)))], borderColor: zc[i], backgroundColor: zc[i], tension: .2 })) },
      options: baseOpts("%", { y: { beginAtZero: false } }) }) + `<div class="cap">Cada zona tiene ~20–35 intenciones por día: ±5 pp en una semana puede ser ruido.</div></div>`;
    const cell = (z, hr) => {
      const b = m.ZH.get(z + "|" + hr + "|baseline") || eA(), c = m.ZH.get(z + "|" + hr + "|campana") || eA();
      const fb = pct(b.fin, b.int), fc = pct(c.fin, c.int), d = fc - fb;
      return `<div class="hc ${!isFinite(d) || Math.abs(d) < 2 ? "" : d > 0 ? "up" : "dn"}"><div class="v">${fP(fc)}</div><div class="d">baseline ${fP(fb)} · <span class="${cls(d)}">${fPp(d)}</span></div><div class="d">${fmtN(c.int)} intenc. en campaña</div></div>`;
    };
    h += `<div class="card"><h3>Finalización campaña vs baseline, zona × hora</h3><div class="hm"><div></div>${[16, 17, 18].map(x => `<div class="eyebrow">${x}:00–${x}:59</div>`).join("")}
      ${[0, 1, 2].map(z => `<div style="align-self:center;font-weight:600">${ZL[z]}</div>` + [16, 17, 18].map(x => cell(z, x)).join("")).join("")}</div>
      <div class="cap">Verde: mejor que baseline por más de 2 pp · rojo: peor · sin color: sin cambio relevante.</div></div></div>`;
  }

  if (st.tab === "bono") {
    const vis = DATA.B.filter(b => st.enCurso || b.dt < EN_CURSO);
    h += `<div class="kg">${kpi(fmtN(bt.conv), `Convocados-día en ${bt.dias} días con bono`)}${kpi(fP(pct(bt.v1, bt.conv)), `Hicieron ≥1 viaje en la ventana · ${fmtN(bt.v1)}`, "mid")}
      ${kpi(fP(pct(bt.v2, bt.conv)), `Llegaron a 2 viajes · ${fmtN(bt.v2)}`)}${kpi(fP(convTot), `Cobraron (PAID) · ${fmtN(bt.paid)} · ${fmtN(bt.v2 - bt.paid)} con 2 viajes no cobraron`, convTot >= 7 ? "ok" : "bad")}</div>`;
    h += `<div class="call info"><b>Dónde se pierde el funnel</b>${fP(100 - pct(bt.v1, bt.conv), 0)} de los convocados-día no hace ni un viaje en la zona y ventana. El cuello de botella no es el segundo viaje (${fP(pct(bt.v2, bt.v1), 0)} de los que hacen uno llegan a dos), sino que el conductor no se conecte en la zona. ${fmtN(bt.v2 - bt.paid)} conductor-días con 2+ viajes no cobraron, probablemente por la tasa de aceptación (65–70%) o de cancelación (15%).</div>`;
    const B = w => m.BS.get(w) || eB(), SL = m.semanas.map(semLabel);
    h += `<div class="g2"><div class="card"><h3>Funnel por semana</h3>` + chart("bF", { type: "bar", data: { labels: SL, datasets: [
      { label: "Convocados-día", data: m.semanas.map(w => B(w).conv), backgroundColor: C.n }, { label: "≥1 viaje", data: m.semanas.map(w => B(w).v1), backgroundColor: C.b },
      { label: "≥2 viajes", data: m.semanas.map(w => B(w).v2), backgroundColor: C.a }, { label: "PAID", data: m.semanas.map(w => B(w).paid), backgroundColor: C.g }] }, options: baseOpts() }) +
      `<div class="cap">Conductor-días. S35–S36 tenían 168–202 convocados por día; desde S37, 141.</div></div>`;
    h += `<div class="card"><h3>Conversión diaria del bono</h3>` + chart("bC", { type: "bar", data: { labels: vis.map(b => ddmm(b.dt)), datasets: [
      { label: "PAID / convocados (%)", data: vis.map(b => r1(pct(b.paid, b.conv))), backgroundColor: vis.map(b => pct(b.paid, b.conv) >= 7 ? C.g : C.b) },
      refLine("Mínimo 7%", 7, vis.length, C.r), refLine("Target 10%", 10, vis.length, C.g)] }, options: baseOpts("%") }) + `<div class="cap">Eje X: día con bono · Eje Y: % de convocados que cobró.</div></div></div>`;
    const pres = m.semanas.filter(w => DATA.pres[w]);
    h += `<div class="g2"><div class="card"><h3>Costo vs comisión generada por semana</h3>` + chart("bR", { type: "bar", data: { labels: SL, datasets: [
      { label: "Costo bono (₲)", data: m.semanas.map(w => B(w).costo), backgroundColor: C.r }, { label: "Comisión muv de PAID en zona (₲)", data: m.semanas.map(w => B(w).com), backgroundColor: C.g }] }, options: baseOpts() }) +
      `<div class="cap">Comisión = viajes FINISHED de los PAID ese día en el polígono y 16–19 h. No es incremental: esos viajes podrían haber ocurrido sin bono.</div></div>`;
    h += `<div class="card"><h3>Presupuesto ejecutado</h3>` + tabla(["Semana", "Tope (30% comisión)", "Pagado", "Ejecutado"],
      pres.map(w => [semLabel(w), fGs(DATA.pres[w]), fGs(B(w).costo), fP(pct(B(w).costo, DATA.pres[w]), 0)])) +
      `<div class="cap">Tope = 30% de la comisión de la semana calendario anterior en el polígono (todas las horas, FINISHED B2C + B2B in-app, sin fraude Jira).</div></div></div>`;
    h += `<div class="sec"><h2>Detalle por código de bono</h2>` + tabla(["Fecha", "Cód.", "Ventana", "Monto", "AR mín.", "Convoc.", "≥1 viaje", "≥2 viajes", "PAID", "Conv.", "Costo", "Viajes PAID", "Comisión", "ROI"],
      vis.map(b => { const r = b.costo > 0 ? 100 * (b.com - b.costo) / b.costo : NaN, cv = pct(b.paid, b.conv);
        return [dot(cv >= 7 ? C.g : cv >= 4 ? C.a : C.r) + dow(b.dt) + " " + ddmm(b.dt), b.cod, b.ventana, fGs(b.monto), b.ar + "%", b.conv, b.v1, b.v2, b.paid, fP(cv), fGs(b.costo), b.viajes, fGs(b.com), `<span class="${cls(r)}">${fP(r, 0)}</span>`]; })) + `</div>`;
  }

  if (st.tab === "oferta") {
    h += `<div class="kg">${kpi(fmtN(htC, 1) + " h", `Grupo test 141 por día con bono · baseline ${fmtN(htB, 1)} h`, htC >= htB ? "ok" : "bad")}
      ${kpi(fD(pct(htC - htB, htB)), "Horas del grupo test vs baseline", htC >= htB ? "ok" : "bad")}
      ${kpi(fmtN(hcC, 1) + " h", `CENTRAL total por día · baseline ${fmtN(hcB, 1)} h`, hcC >= hcB ? "ok" : "bad")}
      ${kpi(fP(pct(htC, hcC)), `Share del grupo test en horas CENTRAL · baseline ${fP(pct(htB, hcB))}`)}</div>`;
    const lbl = ["Baseline", ...sem.map(s => s.label)];
    h += `<div class="g2"><div class="card"><h3>Horas por día, grupo test vs resto de CENTRAL</h3>` + chart("oH", { type: "bar", data: { labels: lbl, datasets: [
      { label: "Grupo test 141 (h/día)", data: [r1(htB), ...sem.map(s => r1(s.ht))], backgroundColor: C.a },
      { label: "Resto CENTRAL (h/día)", data: [r1(hcB - htB), ...sem.map(s => r1(s.hc - s.ht))], backgroundColor: C.n }] },
      options: baseOpts(" h", { root: { scales: { x: { stacked: true, ticks: { color: "#8892a8" } }, y: { stacked: true, ticks: { color: "#8892a8" } } } } }) }) +
      `<div class="cap">Horas en línea por día en CENTRAL, franja ${st.hora === "all" ? "16–19 h" : st.hora + " h"}. Solo días con bono en campaña.</div></div>`;
    h += `<div class="card"><h3>Test vs control (reportes semanales)</h3>` + tabla(["Semana", "Brecha aceptación propia", "Brecha horas/día", "Control con ofertas", "Control baseline"],
      TEST_CONTROL.map(t => [t[0], "+" + fmtN(t[1], 1) + " pp", "+" + fmtN(t[2], 2) + " h", t[3], t[4]])) +
      `<div class="call" style="margin-top:12px"><b>La brecha no es evidencia causal fuerte</b>El control con al menos una oferta cayó de ~95–102 conductores en baseline a 26–36 en campaña. La brecha puede reflejar que el control se desactivó, no que el bono funcione.</div></div></div>`;
  }

  if (st.tab === "metodo") {
    h += `<div class="g2"><div class="sec"><h3>Definiciones</h3>` + tabla(["Métrica", "Cómo se calcula"], [
      ["Intención", "Unidad oficial del marketplace: una intención de viaje del pasajero (fact_intencion_solicitud) con su estado final."],
      ["Finalización", "Intenciones con estado final FINISHED / intenciones, origen dentro del polígono de campaña y hora 16–18."],
      ["Aceptación", "Ofertas aceptadas / ofertas enviadas (fact_conductor_encontrado), mismo polígono y franja."],
      ["Horas conectadas", "fact_tiempo_en_linea_conductor, CENTRAL, 16–18 h. No baja a polígono: la tabla solo trae departamento."],
      ["Conversión del bono", "Conductor-días PAID / convocados-día (fact_bono_conductor, códigos ZONAS_CORE*)."],
      ["ROI", "(Comisión muv de viajes FINISHED de PAID ese día en polígono y 16–19 h − costo) / costo. Contable, no incremental."],
      ["Baseline", "Los 20 días hábiles del 27/07 al 21/08 (pre-campaña)."],
      ["Semana de campaña", "Solo los días con bono."]].map(r => [r[0], `<span style="font-family:var(--ff);white-space:normal">${r[1]}</span>`])) + `</div>`;
    h += `<div class="meta"><h3>Diferencias con los reportes semanales</h3>
      <p>La campaña empezó el 24/08 (S35), no el 31/08: hay 5 bonos ZONAS_CORE esa semana, con 168–202 convocados y AR mínimo 70% los dos primeros días.</p>
      <p>El reporte S36 cubría lun–jue; acá S36 incluye el viernes 04/09.</p>
      <p>El miércoles 16/09 el bono fue de 17 a 20 h; el dashboard mide siempre 16–19 h para comparar.</p>
      <p>Validado contra los reportes S37, S38 y S39: coinciden exacto. El 28/09 fue atípico (7 intenciones en la zona, mitad de horas en CENTRAL).</p>
      <h3 style="margin-top:14px">Fuente</h3><p>AWS Athena (data lake muv), datos al ${DATA.fechaDatos}. Test vs control: reportes semanales S37–S39.</p></div></div>`;
  }

  document.getElementById("body").innerHTML = h;
  charts.forEach(([id, cfg]) => new Chart(document.getElementById(id), cfg));
}

const TABS = [["resumen", "Resumen"], ["diario", "Evolución diaria"], ["zonas", "Zonas"], ["bono", "Bono y funnel"], ["oferta", "Oferta y horas"], ["metodo", "Metodología"]];
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab${st.tab === k ? " on" : ""}" data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.k; renderTabs(); render(); });
}
document.getElementById("subtitle").textContent = `Bono ₲23.000–25.000 por 2 viajes finalizados de 16 a 19 h, lista cerrada. Campaña desde el 24/08/2026 contra baseline pre-campaña (27/07–21/08, lun–vie). Datos al ${DATA.fechaDatos}.`;
document.getElementById("fZona").onchange = e => { st.zona = e.target.value; render(); };
document.getElementById("fHora").onchange = e => { st.hora = e.target.value; render(); };
if (HAY_EN_CURSO) {
  document.getElementById("enCursoLbl").textContent = `S${isoWeek(EN_CURSO)} (en curso)`;
  document.getElementById("fEnCurso").onchange = e => { st.enCurso = e.target.checked; render(); };
} else document.getElementById("enCursoWrap").style.display = "none";
renderTabs(); render();
</script>
</body>
</html>
