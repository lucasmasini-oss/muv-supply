function model() {

  for (const r of DATA.M) {
    const d = DATA.days[r[0]]; if (hr !== null && r[1] !== hr) continue;
    if (zi === null || r[2] === zi) addM(g(D, d), d, r);
    if (!incl(d)) continue;

    if (zi !== null && r[2] !== zi) continue;
    for (const k of camp === "campana" ? [p, "campana", "w:" + p] : [p, "w:" + mondayOf(d)]) addM(g(P, k), d, r);
  }
  for (const r of DATA.A) {
    const d = DATA.days[r[0]]; if (hr !== null && r[1] !== hr) continue;
    if (zi === null || r[2] === zi) addA(g(D, d), r);
    if (!incl(d)) continue;
    const p = per(d), camp = p === "baseline" ? "baseline" : "campana";
    addA(g(ZP, r[2] + "|" + p), r);
    if (zi !== null && r[2] !== zi) continue;
    for (const k of camp === "campana" ? [p, "campana", "w:" + p] : [p, "w:" + mondayOf(d)]) addA(g(P, k), r);

  const CT = new Map(), gc = k => { if (!CT.has(k)) CT.set(k, eC()); return CT.get(k); };
  for (const r of DATA.C) {

    if (!incl(d)) continue;
    const p = per(d);
    for (const k of p === "baseline" ? [p, "w:" + mondayOf(d)] : [p, "campana", "w:" + p]) addC(gc(k), d, r);

  if (st.tab === "bono") {

      { label: "Test sin bono (₲/h)", data: [Math.round(eph(dTB, false)), ...sem.map(s => Math.round(eph(s.t, false)))], borderColor: C.b, backgroundColor: C.b, tension: .2 },
      { label: "Control (₲/h)", data: [Math.round(eph(dCB)), ...sem.map(s => Math.round(eph(s.k)))], borderColor: C.n, backgroundColor: C.n, tension: .2 }] }, options: baseOpts() }) +
      `<div class="cap">Solo días con bono. Guaraníes por hora = (ganancia de viajes FINISHED 16–19 h, cualquier zona + bono PAID) / horas conectadas en CENTRAL 16–19 h.</div></div>`;
    h += `<div class="card"><h3>Retención semanal de la lista</h3>` + chart("pR", { type: "line", data: { labels: L, datasets: [
      { label: "Test: % de 141 conectados", data: [r1(m.retB[0]), ...sem.map(s => r1(s.ret[0]))], borderColor: C.g, backgroundColor: C.g, tension: .2 },
      { label: "Control: % de 134 conectados", data: [r1(m.retB[1]), ...sem.map(s => r1(s.ret[1]))], borderColor: C.n, backgroundColor: C.n, tension: .2 }] }, options: baseOpts("%") }) +
      `<div class="cap">% de la lista con al menos 1 hora conectada en CENTRAL 16–19 h algún día hábil de la semana. Baseline = promedio de las 4 semanas pre.</div></div></div>`;
    h += `<div class="sec"><h2>Test vs control por semana</h2>` + tabla(["Semana", "Acep. propia test", "Acep. propia control", "Brecha acep. (DiD)", "Brecha horas/cond-día", "Ganancia/h test", "Ganancia/h control", "Control con ofertas"],
      [["Baseline", fP(acepD(dTB)), fP(acepD(dCB)), "—", "—", fGs(eph(dTB)), fGs(eph(dCB)), "—"],
       ...sem.map(s => [s.label + " · " + ddmm(s.w), fP(acepD(s.t)), fP(acepD(s.k)), dSpan(s.brechaAcep), (s.brechaHoras > 0 ? "+" : "") + fmtN(s.brechaHoras, 2) + " h", fGs(eph(s.t)), fGs(eph(s.k)), isFinite(s.ret[3]) ? fmtN(s.ret[3]) : "—"])], ["base"]) +
      `<div class="cap">Aceptación propia = ofertas aceptadas / recibidas por los conductores de cada lista, 16–19 h, cualquier zona. Brecha = (test vs su baseline) − (control vs su baseline). "Control con ofertas" = conductores del control con ≥1 oferta en la semana. No dependen de los filtros de zona y hora.</div></div>`;
  }

  if (st.tab === "metodo") {
    h += `<div class="g2"><div class="sec"><h3>Definiciones</h3>` + tabla(["Métrica", "Cómo se calcula"], [
      ["Intención", "Unidad oficial del marketplace: una intención de viaje del pasajero (fact_intencion_solicitud) con su estado final."],
      ["Finalización", "Intenciones con estado final FINISHED / intenciones, origen dentro del polígono de campaña y hora 16–18."],
      ["Aceptación", "Ofertas aceptadas / ofertas enviadas (fact_conductor_encontrado), mismo polígono y franja."],
      ["Horas conectadas", "fact_tiempo_en_linea_conductor, CENTRAL, 16–18 h. No baja a polígono: la tabla solo trae departamento."],
      ["Conversión del bono", "Conductor-días PAID / convocados-día (fact_bono_conductor, códigos ZONAS_CORE*)."],
      ["Costo por viaje", "Costo pagado / viajes FINISHED de los PAID ese día en polígono y 16–19 h. No es costo por viaje incremental."],
      ["Subsidio % GMV", "Costo pagado / GMV (lc_monto_pagar_curado) de esos mismos viajes. Se compara con el take rate (comisión / GMV)."],
      ["Zonas control", "Polígonos 'ZONA xx - ALTA DEMANDA' fuera del polígono de campaña, sin 00/01/04/05. Mismos días y horas."],
      ["Diff-in-diff", "(Campaña días bono − campaña baseline) − (control mismos días − control baseline). ±2 pp se trata como ruido."],
      ["ETA", "cant_sec_eta del conductor que aceptó (fact_conductor_encontrado), 0–60 min."],
      ["Llegada real", "DRIVER_OTW → WAITING_FOR_PASSENGER en stk_estado_viaje, viajes aceptados del polígono, 0–60 min."],
      ["Cancelación por motivo", "Intenciones con estado final CANCELLED, por quién canceló, estado previo (SEARCH vs conductor asignado) y motivo declarado."],
      ["Horas por intención", "Horas CENTRAL 16–19 h / intenciones del polígono. Ratio de oferta relativa, no cobertura del polígono."],
      ["Ganancia por hora", "(lc_ganancia_conductor de viajes FINISHED 16–19 h + bono PAID) / horas CENTRAL 16–19 h, listas test 141 y control 134."],
      ["Retención semanal", "% de la lista con ≥1 hora conectada en CENTRAL 16–19 h algún día hábil de la semana."],
      ["Baseline", "Los 20 días hábiles del 27/07 al 21/08 (pre-campaña)."],
      ["Semana de campaña", "Solo los días con bono."]].map(r => [r[0], `<span style="font-family:var(--ff);white-space:normal">${r[1]}</span>`])) + `</div>`;
    h += `<div class="meta"><h3>Diferencias con los reportes semanales</h3>
      <p>La campaña empezó el 24/08 (S35), no el 31/08: hay 5 bonos ZONAS_CORE esa semana, con 168–202 convocados y AR mínimo 70% los dos primeros días.</p>
      <p>El reporte S36 cubría lun–jue; acá S36 incluye el viernes 04/09.</p>
      <p>El miércoles 16/09 el bono fue de 17 a 20 h; el dashboard mide siempre 16–19 h para comparar.</p>
      <p>Validado contra los reportes S37, S38 y S39: coinciden exacto. El 28/09 fue atípico (7 intenciones en la zona, mitad de horas en CENTRAL).</p>
      <h3 style="margin-top:14px">Fuente</h3><p>AWS Athena (data lake muv), datos al ${DATA.fechaDatos}. Test vs control se recalcula con las listas 141/134 de S37 (reproduce las brechas de los reportes: S37 +13,6 pp).</p></div></div>`;
  }

  document.getElementById("body").innerHTML = h;
  charts.forEach(([id, cfg]) => new Chart(document.getElementById(id), cfg));
}

const TABS = [["resumen", "Resumen"], ["diario", "Evolución diaria"], ["control", "¿Es el bono? (control)"], ["zonas", "Zonas"], ["bono", "Bono, funnel y costo"],
  ["oferta", "Oferta, ETA y cancelaciones"], ["conductores", "Conductores"], ["metodo", "Metodología"]];
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab${st.tab === k ? " on" : ""}" data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.k; renderTabs(); render(); });
}
document.getElementById("subtitle").textContent = `Bono ₲23.000–25.000 por 2 viajes finalizados de 16 a 19 h, lista cerrada. Campaña desde el 24/08/2026 contra baseline pre-campaña (27/07–21/08, lun–vie). Datos al ${DATA.fechaDatos}.`;
document.getElementById("fZona").onchange = e => { st.zona = e.target.value; render(); };
document.getElementById("fHora").onchange = e => { st.hora = e.target.value; render(); };
if (HAY_EN_CURSO) {
  document.getElementById("enCursoLbl").textContent = `S${isoWeek(EN_CURSO)} (en curso)`;
  document.getElementById("fEnCurso").onchange = e => { st.enCurso = e.target.checked; render(); };
} else document.getElementById("enCursoWrap").style.display = "none";
renderTabs(); render();
</script>
</body>
</html>
