<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f3f5fa;--s1:#ffffff;--s2:#eef1f8;--brd:#dce1ee;--tx:#1a2133;--tx2:#4f5a75;--tx3:#8791a8;
--ac:#4f46e5;--acd:rgba(79,70,229,.10);
--g:#15803d;--gd:rgba(22,163,74,.12);--r:#dc2626;--rd:rgba(220,38,38,.10);--a:#b45309;--ad:rgba(217,119,6,.13);

body{font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:13px}
.wrap{max-width:1400px;margin:0 auto;padding:22px 26px 60px}
.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ac);font-weight:700}
.wrap{border-top:4px solid var(--ac)}
.card,.kc,.tabs,.tw,.call{box-shadow:0 1px 2px rgba(26,33,51,.05)}
.kc{border-top:2px solid var(--acd)}
.btn:hover{border-color:var(--ac)}
h1{font-size:22px;margin:6px 0 6px}h2{font-size:16px;margin:4px 0 10px}h3{font-size:13px;margin-bottom:6px}
.sub{color:var(--tx2);font-size:12px;line-height:1.5}
.cap{color:var(--tx3);font-size:10.5px;margin-top:6px;line-height:1.45}
.bar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:16px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--brd)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:3px}
.tab{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--tx2);border:none;background:none;font-family:var(--ff)}
.tab:hover{color:var(--tx)}.tab.on{background:var(--ac);color:#fff}
.sp{flex:1}
.fg{display:flex;flex-direction:column;gap:3px}.fg label{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);font-weight:700}
select,input[type=text],input[type=number]{background:var(--s2);border:1px solid var(--brd);color:var(--tx);padding:7px 9px;border-radius:7px;font-family:var(--ff);font-size:12px;min-width:120px}
input[type=number]{min-width:80px;width:90px}
.chk{display:flex;align-items:center;gap:6px;height:32px;font-size:12px;color:var(--tx2)}
.btn{background:var(--s2);border:1px solid var(--brd);color:var(--tx2);padding:7px 12px;border-radius:7px;font-family:var(--ff);font-size:12px;cursor:pointer}
.btn:hover{color:var(--tx)}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kc{background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:14px 16px}
.kv{font-family:var(--mono);font-size:21px;font-weight:600}.kl{font-size:10.5px;color:var(--tx2);margin-top:5px;line-height:1.4}
.kd{font-size:10.5px;margin-top:6px;line-height:1.5;color:var(--tx2)}
.ok{color:var(--g)}.bad{color:var(--r)}.mid{color:var(--a)}.neu{color:var(--tx2)}
.call{border:1px solid var(--brd);border-left:3px solid var(--a);background:var(--s1);border-radius:8px;padding:12px 14px;margin-bottom:18px;line-height:1.55}
.call.info{border-left-color:var(--b)}.call b{display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:20px}
.card{background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:16px}
.ch{position:relative;height:280px}.ch.s{height:210px}
.sec{margin-bottom:22px}
.tw{overflow:auto;border:1px solid var(--brd);border-radius:10px;max-height:620px}
table{width:100%;border-collapse:collapse;font-size:11.5px}thead{background:var(--s2);position:sticky;top:0;z-index:2}
th{padding:8px;text-align:right;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);border-bottom:1px solid var(--brd);white-space:nowrap}
th.sort{cursor:pointer}th.sort:hover{color:var(--tx)}th.cur{color:var(--ac)}
td{padding:7px 8px;border-bottom:1px solid var(--brd);font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.txt{font-family:var(--ff);text-align:left}
tr.base td{background:var(--s2)}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--s2)}tr.sel td{background:var(--acd)}
tr.grp td{background:var(--s2);font-family:var(--ff);font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-family:var(--ff);font-weight:600}
.pill.ok{background:var(--gd)}.pill.mid{background:var(--ad)}.pill.bad{background:var(--rd)}.pill.neu{background:var(--s2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.meta p{font-size:12px;color:var(--tx2);line-height:1.55;margin-bottom:8px}.meta h3{margin-top:14px}
.meta li{font-size:12px;color:var(--tx2);line-height:1.55;margin-left:18px}
.id{font-size:10px;color:var(--tx2)}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:1000px){.kg{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
</style>

      return `<tr class="clk ${sel(r)}" onclick="pickDrv(${r.d})"><td>${idCell(r)}</td><td class="txt">${r.cat}</td>${PUB ? "" : `<td class="txt">${r.veh}</td>`}${cols.map(([k]) => `<td>${cell(k)}</td>`).join("")}<td><span class="pill ${r.est[0]}">${r.est[1]}</span></td></tr>`;
    }).join("");
  }

  <div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function detailHtml(m) {

  const e = w => mp.get(w) || E();
  const one = (k) => wk.map(w => mp.get(w) ? M[k].f(e(w)) : NaN);
  killCharts("dd");
  const c1 = mixCfg(lab, [Bs("Horas conectadas", one("h"), C.b, { yAxisID: "y" }), L("Viajes finalizados", one("fin"), C.g, { yAxisID: "y2" })], "", { beginAtZero: true }, { beginAtZero: true });
  const c2 = lineCfg(lab, [L("Aceptación", one("ar"), C.g), L("Finalización", one("finr"), C.a), L("Aceptación grupo", wk.map(w => M.ar.f(g(w))), C.g, { borderDash: [5, 4], pointRadius: 0 }), L("Finalización grupo", wk.map(w => M.finr.f(g(w))), C.a, { borderDash: [5, 4], pointRadius: 0 })], "%", { beginAtZero: true });
  const c3 = lineCfg(lab, [L("EPH", one("eph"), C.g, { yAxisID: "y" }), L("EPH grupo", wk.map(w => M.eph.f(g(w))), C.g, { yAxisID: "y", borderDash: [5, 4], pointRadius: 0 }), L("EPT", one("ept"), C.p, { yAxisID: "y2" })], "", { beginAtZero: false }, { beginAtZero: false });
  return `<div class="card" style="margin-bottom:18px"><div class="row" style="justify-content:space-between;margin:0 0 8px"><div><h3 style="margin:0">Conductor <span class="id" style="font-size:12px">${DR[d].id}</span> · ${DR[d].cat}</h3>${PUB ? "" : `<div class="cap" style="margin:2px 0 0">${DR[d].veh || "—"} · ${fmtN(DR[d].vt)} viajes en el archivo de la lista (período no especificado)</div>`}</div><button class="btn" onclick="pickDrv(null)">Cerrar</button></div>
  <div class="g3" style="margin-bottom:0"><div>${chart("dd1", c1, 1)}<div class="cap">Horas (barras, izq.) y viajes finalizados (línea, der.).</div></div><div>${chart("dd2", c2, 1)}<div class="cap">Líneas punteadas: promedio del grupo con los filtros activos.</div></div><div>${chart("dd3", c3, 1)}<div class="cap">EPH (izq.) vs grupo y EPT (der.), ₲.</div></div></div></div>`;
}
function vDriver(m) {
  const metOpts = DRV_EVO.map(x => `<option value="${x.k}" ${x.k === st.met ? "selected" : ""}>${x.n}</option>`).join("");
  return `<div class="row"><div class="fg"><label>Vista</label><select onchange="st.vista=this.value;st.sort={k:st.vista==='evo'?'tot':'h',dir:-1};render()"><option value="evo" ${st.vista === "evo" ? "selected" : ""}>Evolución semanal de una métrica</option><option value="acum" ${st.vista === "acum" ? "selected" : ""}>Acumulado del período (todas las métricas)</option></select></div>
  ${st.vista === "evo" ? `<div class="fg"><label>Métrica</label><select style="min-width:320px" onchange="st.met=this.value;st.sort={k:'tot',dir:-1};render()">${metOpts}</select></div>` : ""}
  <div class="fg"><label>Buscar ID / vehículo</label><input type="text" id="fQ" value="${st.q}" placeholder="${PUB ? "ej. D012" : PRIV.ph}" oninput="setQ(this.value)"></div>
  <div class="fg"><label>Filtro</label><div class="chk"><input type="checkbox" id="fDeb" ${st.soloDeb ? "checked" : ""} onchange="st.soloDeb=this.checked;refreshDrv()"> solo debajo de la meta de horas</div></div>

}
let MODEL = null;
function refreshDrv() { killCharts("dd"); MODEL = model(); document.getElementById("ddet").innerHTML = detailHtml(MODEL); document.getElementById("dtab").innerHTML = drvTable(MODEL); mountCharts(); }
function setQ(v) { st.q = v; document.getElementById("dtab").innerHTML = drvTable(MODEL); }
function sortBy(k) { const txt = k === "id" || k === "cat"; st.sort = { k, dir: st.sort.k === k ? -st.sort.dir : (txt ? 1 : -1) }; refreshDrv(); }
function pickDrv(d) { st.drv = d; refreshDrv(); if (d !== null) document.getElementById("ddet").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
function exportCsv() {
  const m = MODEL, rows = driverRows(m), wk = m.weeks;
  const head = ["cod_conductor", "categoria", "vehiculo", "semanas_activas", "horas", "horas_mes_est", "estado_meta", "ofertas", "aceptadas", "tasa_aceptacion", "asignados", "finalizados", "tasa_finalizacion", "eph", "ept", "ganancia",
    ...wk.flatMap(w => ["horas_" + w, "finalizados_" + w, "aceptacion_" + w, "eph_" + w])];
  const f = v => isFinite(v) ? (+v.toFixed(2)) : "";
  const lines = [head.join(",")].concat(rows.map(r => [DR[r.d].id, r.cat, '"' + r.veh + '"', r.sem, f(r.tot.h), f(r.hMes), r.est[1], r.tot.of, r.tot.ac, f(r.x_ar), r.tot.asig, r.tot.fin, f(r.x_finr), f(r.x_eph), f(r.x_ept), r.tot.gan,
    ...r.weekly.flatMap(e => e ? [f(e.h), e.fin, f(M.ar.f(e)), f(M.eph.f(e))] : ["", "", "", ""])].join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" })); a.download = "amplify_por_conductor.csv"; a.click();
}

// ---- marketplace: grupo vs resto
const SL = { all: "CENTRAL · todo el día", pico: "CENTRAL · pico lun–vie 16–18 h", core: "Polígono Core · 16–18 h lun–vie" };
function mk(w, s) {
  const x = DATA.MK[w] || {}, ic = (x.ic || {})[s] || [0, 0, 0], of = (x.of || {})[s] || [0, 0, 0, 0], hr = x.hr || [0, 0, 0, 0, 0, 0], vj = x.vj || [0, 0, 0, 0, 0, 0, 0, 0];
  const N = ic[0] + ic[1] + ic[2];
  return { G: ic[0], R: ic[1], X: ic[2], N, fin: pct(ic[0] + ic[1], N), gN: pct(ic[0], N), rN: pct(ic[1], N),
    oG: of[0], aG: of[1], oR: of[2], aR: of[3], arG: pct(of[1], of[0]), arR: pct(of[3], of[2]), arM: pct(of[1] + of[3], of[0] + of[2]),
    shOf: pct(of[0], of[0] + of[2]), shAc: pct(of[1], of[1] + of[3]), shFin: pct(ic[0], ic[0] + ic[1]),
    hG: hr[0], hR: hr[1], hpG: hr[2], hpR: hr[3], cG: hr[4], cR: hr[5], shH: pct(hr[0], hr[0] + hr[1]), shHp: pct(hr[2], hr[2] + hr[3]),
    fG: vj[1], fR: vj[5], asG: vj[0], asR: vj[4], vphG: hr[0] > 0 ? vj[1] / hr[0] : NaN, vphR: hr[1] > 0 ? vj[5] / hr[1] : NaN, finG: pct(vj[1], vj[0]), finR: pct(vj[5], vj[4]), shV: pct(vj[1], vj[1] + vj[5]) };
}
function vMkt(m) {
  const wk = SEM.filter(s => s < PARC || st.parcial), lab = wk.map(semL), s = st.mkSlice;
  const cs = COMPLETAS;
  if (!st.mkFrom || !wk.includes(st.mkFrom)) st.mkFrom = cs[cs.length - 2] || cs[0];
  if (!st.mkTo || !wk.includes(st.mkTo)) st.mkTo = cs[cs.length - 1];
  const X = wk.map(w => mk(w, s)), A = mk(st.mkFrom, s), B = mk(st.mkTo, s), AA = mk(st.mkFrom, "all"), BB = mk(st.mkTo, "all");
  const wopt = sel => wk.map(w => `<option value="${w}" ${w === sel ? "selected" : ""}>${semL(w)}</option>`).join("");
  const sliceOpt = Object.entries(SL).map(([k, t]) => `<option value="${k}" ${k === s ? "selected" : ""}>${t}</option>`).join("");
  // descomposición de la finalización
  const gp = B.gN - A.gN, rp = B.rN - A.rN, dN = pct(B.N - A.N, A.N), dX = pct(B.X - A.X, A.X), dG = pct(B.G - A.G, A.G), dR = pct(B.R - A.R, A.R), dFinT = pct((B.G + B.R) - (A.G + A.R), A.G + A.R);
  const arCf = (B.oG * (A.aG / A.oG) + B.aR) / (B.oG + B.oR) * 100;
  const dH = pct((BB.hG + BB.hR) - (AA.hG + AA.hR), AA.hG + AA.hR);
  const efDen = dN < -10 && B.fin > A.fin;
  const call = `<div class="call ${efDen ? "" : "info"}"><b>${SL[s]} · ${semS(st.mkFrom)} → ${semS(st.mkTo)}</b>Finalización del marketplace ${fP(A.fin)} → ${fP(B.fin)} (${dTxt(M.finr, B.fin - A.fin)}): grupo ${gp >= 0 ? "+" : ""}${fmtN(gp, 1)} pp y resto ${rp >= 0 ? "+" : ""}${fmtN(rp, 1)} pp. Intenciones ${fmtN(A.N)} → ${fmtN(B.N)} (${dTxt(M.h, dN)}), no finalizadas ${dTxt(M.h, dX)}, finalizadas totales ${dTxt(M.h, dFinT)}${s === "all" ? `, horas conectadas CENTRAL ${dTxt(M.h, dH)}` : ""}. ${efDen ? "La finalización subió con menos intenciones: parte de la mejora es efecto denominador (menos demanda sin atender), no más viajes." : "Compará volúmenes y tasas: una tasa puede subir porque cae el denominador."} Aceptación ${fP(A.arM)} → ${fP(B.arM)}; el grupo aporta ${fmtN(B.arM - arCf, 1)} pp (con su aceptación congelada en ${semS(st.mkFrom)} el marketplace habría dado ${fP(arCf)}).</div>`;
  const c1 = lineCfg(lab, [L("Grupo Amplify", X.map(x => x.arG), C.ac), L("Resto de conductores", X.map(x => x.arR), C.n), L("Marketplace", X.map(x => x.arM), C.b, { borderDash: [5, 4] })], "%", { beginAtZero: true });
  const c2 = mixCfg(lab, [Bs("Finalizadas por el grupo", X.map(x => x.G), C.ac, { stack: "a" }), Bs("Finalizadas por el resto", X.map(x => x.R), C.b, { stack: "a" }), Bs("No finalizadas", X.map(x => x.X), C.r, { stack: "a" })], "", { beginAtZero: true, stacked: true });
  c2.options.scales.x.stacked = true;
  const c3 = lineCfg(lab, [L("Finalización marketplace", X.map(x => x.fin), C.a), L("Aporte del grupo (finalizadas grupo / intenciones)", X.map(x => x.gN), C.g, { borderDash: [5, 4] }), L("Aporte del resto", X.map(x => x.rN), C.b, { borderDash: [5, 4] })], "%", { beginAtZero: true });
  const all = wk.map(w => mk(w, "all"));
  const c4 = lineCfg(lab, [L("% de horas conectadas", all.map(x => x.shH), C.n), L("% de ofertas recibidas", all.map(x => x.shOf), C.c), L("% de ofertas aceptadas", all.map(x => x.shAc), C.b), L("% de viajes finalizados", all.map(x => x.shV), C.g)], "%", { beginAtZero: true });
  const c5 = lineCfg(lab, [L("Grupo Amplify", all.map(x => x.vphG), C.ac), L("Resto de conductores", all.map(x => x.vphR), C.n)], "", { beginAtZero: true });
  const c6 = lineCfg(lab, [L("Grupo Amplify", all.map(x => x.finG), C.ac), L("Resto de conductores", all.map(x => x.finR), C.n)], "%", { beginAtZero: false });
  const tb = tabla(["Semana", "Intenciones", "Fin. grupo", "Fin. resto", "No fin.", "Finalización", "Acept. grupo", "Acept. resto", "Acept. mkt", "% ofertas grupo", "% aceptadas grupo"],
    wk.map((w, i) => { const x = X[i]; return [semL(w), d0(x.N), d0(x.G), d0(x.R), d0(x.X), fP(x.fin), fP(x.arG), fP(x.arR), fP(x.arM), fP(x.shOf), fP(x.shAc)]; }));
  const tb2 = tabla(["Semana", "Horas grupo", "Horas resto", "% horas grupo", "Conductores grupo", "Conductores resto", "Fin. grupo", "Fin. resto", "% fin. grupo", "Viajes/h grupo", "Viajes/h resto", "Finalización viajes grupo", "Finalización viajes resto"],
    wk.map((w, i) => { const x = all[i]; return [semL(w), d0(x.hG), d0(x.hR), fP(x.shH), d0(x.cG), d0(x.cR), d0(x.fG), d0(x.fR), fP(x.shV), d2(x.vphG), d2(x.vphR), fP(x.finG), fP(x.finR)]; }));
  const dec = tabla(["", semS(st.mkFrom), semS(st.mkTo), "Cambio"], [
    ["Intenciones", d0(A.N), d0(B.N), dTxt(M.h, dN)], ["Finalizadas por el grupo", d0(A.G), d0(B.G), dTxt(M.h, dG)], ["Finalizadas por el resto", d0(A.R), d0(B.R), dTxt(M.h, dR)], ["No finalizadas", d0(A.X), d0(B.X), dTxt(M.h, dX)],
    ["Finalización marketplace", fP(A.fin), fP(B.fin), dTxt(M.finr, B.fin - A.fin)], ["· aporte del grupo", fP(A.gN), fP(B.gN), dTxt(M.finr, gp)], ["· aporte del resto", fP(A.rN), fP(B.rN), dTxt(M.finr, rp)],

  ], ["", "", "", "", "base", "", "", "", "", "base"]);

  <div class="fg"><label>Comparar desde</label><select onchange="st.mkFrom=this.value;render()">${wopt(st.mkFrom)}</select></div><div class="fg"><label>hasta</label><select onchange="st.mkTo=this.value;render()">${wopt(st.mkTo)}</select></div></div>
  ${call}
  <div class="g2"><div class="card"><h3>Descomposición ${semS(st.mkFrom)} → ${semS(st.mkTo)} · ${SL[s]}</h3>${dec}<div class="cap">Aporte = finalizadas del grupo (o del resto) / intenciones totales. Intención = unidad oficial del funnel; el conductor es el último que tuvo la intención. Core: ~300–450 intenciones por semana, diferencias chicas son pocos viajes.</div></div>
  <div class="card"><h3>Aceptación: grupo vs resto vs marketplace</h3>${chart("m1", c1)}<div class="cap">${SL[s]} · ofertas distintas (viaje, conductor) aceptadas / recibidas.</div></div>
  <div class="card"><h3>Intenciones por estado final</h3>${chart("m2", c2)}<div class="cap">${SL[s]} · barras apiladas: finalizadas por el grupo, por el resto y no finalizadas.</div></div>
  <div class="card"><h3>Finalización del marketplace y aporte del grupo</h3>${chart("m3", c3)}<div class="cap">${SL[s]} · finalizadas / intenciones.</div></div>
  <div class="card"><h3>Peso del grupo en CENTRAL</h3>${chart("m4", c4)}<div class="cap">Participación del grupo en horas, ofertas, aceptadas y viajes finalizados (todo el día, CENTRAL).</div></div>
  <div class="card"><h3>Productividad: viajes finalizados por hora conectada</h3>${chart("m5", c5)}<div class="cap">CENTRAL, todo el día · viajes finalizados (origen ASUNCIÓN/CENTRAL) / horas en línea CENTRAL.</div></div>
  <div class="card"><h3>Finalización de viajes: grupo vs resto</h3>${chart("m6", c6)}<div class="cap">Viajes finalizados / asignados, CENTRAL.</div></div></div>
  <div class="sec"><h2>Intenciones y aceptación · ${SL[s]}</h2>${tb}</div>
  <div class="sec"><h2>Horas y viajes · CENTRAL, todo el día</h2>${tb2}</div>
  <div class="cap">El marketplace no responde al filtro de categoría ni al panel: siempre compara los 113 calificados contra el resto. Semana * parcial.</div>`;
}

function vMetodo() {
  return `<div class="meta" style="max-width:980px"><h2>Metodología y definiciones</h2>
  <h3>Grupo</h3><p>${DR.length} conductores de ${PUB ? "la lista de calificados" : PRIV.lista} (${DR.filter(d => d.cat === "ORO").length} ORO, ${DR.filter(d => d.cat === "PLATA").length} PLATA; los que figuran en ambas por tener dos vehículos cuentan como ORO). Es la lista de calificados/ofrecidos, no necesariamente la de firmantes. Marcas de fraude en el grupo: ${DATA.fraude}. Los viajes marcados como fraude se excluyen (misma lógica que la query base de fraude de Jira).</p>
  <h3>Semanas</h3><p>Lunes a domingo. ${HAY_PARC ? `La semana del ${ddmm(PARC)} (marcada con *) es parcial: datos al ${DATA.fechaDatos}. No se compara con semanas completas; se puede incluir con el filtro de arriba.` : ""}</p>
  <h3>Métricas</h3><ul>
  <li><b>Horas conectadas</b>: horas en línea (fact_tiempo_en_linea_conductor, deduplicadas). Pico = lunes a viernes 16–18 h.</li>
  <li><b>Conductor activo</b>: al menos una hora conectada en la semana.</li>
  <li><b>Tasa de aceptación</b>: ofertas distintas (viaje, conductor) aceptadas / ofertas recibidas (fact_conductor_encontrado). La tabla trae ~30% de pares repetidos; el dash de bonos usa COUNT(*) y por eso da otro nivel.</li>
  <li><b>Tasa de finalización</b>: viajes finalizados / viajes asignados al conductor (fact_viaje). En la pestaña Marketplace, "finalización" es finalizadas / intenciones.</li>
  <li><b>Cancelación del conductor</b>: ofertas aceptadas que terminaron canceladas por el conductor / ofertas aceptadas.</li>
  <li><b>EPH</b>: ganancia del conductor (lc_ganancia_conductor) de viajes finalizados / horas conectadas. <b>EPT</b>: ganancia / viajes finalizados. Sin bonos ni incentivo Amplify.</li>
  <li><b>Reserva</b>: viaje con fuente WEB-SCHEDULED (fact_viaje_financiero).</li></ul>
  <h3>Cumplimiento de horas (referencia)</h3><p>${PUB ? "La meta de horas es de referencia y editable. Se aproxima con horas en línea de muv: meta mensual × 12/52 por semana; el estimado mensual es el promedio semanal de las semanas completas × 52/12. No se calcula cumplimiento de viajes." : PRIV.cumpl}</p>
  <h3>Marketplace</h3><p>CENTRAL = ASUNCIÓN + CENTRAL. Core = polígono de la campaña de bonos, 16–18 h lun–vie (misma lógica que el dash de bonos: la finalización coincide). El conductor de una intención es el último que la tuvo. "Aporte" = finalizadas del grupo / intenciones totales. El contrafactual de aceptación congela la aceptación del grupo en la semana inicial.</p>
  <h3>Límites</h3><ul><li>Sin período previo ni grupo de control: la evolución no prueba causalidad del acuerdo.</li><li>No se conoce fecha de inicio, firmantes ni umbrales efectivos.</li><li>Una tasa del marketplace puede subir porque baja el denominador (menos intenciones); mirar siempre los volúmenes.</li>${PUB ? "" : PRIV.lim}</ul>
  ${PUB ? "" : PRIV.upd}</div>`;
}

// ---- shell
const TABS = [["resumen", "Resumen"], ["semana", "Por semana"], ["driver", "Por driver"], ["mkt", "Marketplace"], ["metodo", "Metodología"]];
function setTab(t) { st.tab = t; render(); }
function render() {
  killCharts(); reg.length = 0;
  document.getElementById("tabs").innerHTML = TABS.map(([k, t]) => `<button class="tab ${st.tab === k ? "on" : ""}" onclick="setTab('${k}')">${t}</button>`).join("");
  MODEL = model();
  const body = document.getElementById("body");
  body.innerHTML = st.tab === "resumen" ? vResumen(MODEL) : st.tab === "semana" ? vSemana(MODEL) : st.tab === "driver" ? vDriver(MODEL) : st.tab === "mkt" ? vMkt(MODEL) : vMetodo();
  mountCharts();
}
function init() {
  const ult = COMPLETAS[COMPLETAS.length - 1];
  document.getElementById("subtitle").innerHTML = `${DR.length} conductores calificados (${DR.filter(d => d.cat === "ORO").length} ORO · ${DR.filter(d => d.cat === "PLATA").length} PLATA) · semanas lun–dom ${semS(SEM[0])} a ${semS(ult)}${HAY_PARC ? " + semana parcial*" : ""} · datos al ${DATA.fechaDatos}${PUB ? "" : PRIV.sub} · se mide: horas de conexión, viajes finalizados, aceptación y finalización`;
  document.getElementById("eyebrow").textContent = PUB ? "muv · supply · seguimiento de grupo de conductores (Amplify)" : PRIV.eyebrow;
  document.getElementById("fMeta").value = st.meta;
  document.getElementById("fMeta").onchange = e => { st.meta = Math.max(0, +e.target.value || 0); render(); };
  document.getElementById("fCat").onchange = e => { st.cat = e.target.value; render(); };
  document.getElementById("fPanel").onchange = e => { st.panel = e.target.value; render(); };
  const pw = document.getElementById("parcWrap");
  if (!HAY_PARC) pw.style.display = "none";
  else { document.getElementById("parcLbl").textContent = "Semana parcial (" + ddmm(PARC) + ")"; document.getElementById("fParc").onchange = e => { st.parcial = e.target.checked; render(); }; }
  render();
}
init();
