<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f2f6f6;--s1:#ffffff;--s2:#eaf1f1;--brd:#d6e0e0;--tx:#16282a;--tx2:#4a6063;--tx3:#83999c;
--ac:#0f766e;--acd:rgba(15,118,110,.10);
--g:#15803d;--gd:rgba(22,163,74,.12);--r:#dc2626;--rd:rgba(220,38,38,.10);--a:#b45309;--ad:rgba(217,119,6,.13);
--b:#2563eb;--bd:rgba(37,99,235,.10);--ff:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:13px}
.wrap{max-width:1400px;margin:0 auto;padding:22px 26px 60px;border-top:4px solid var(--ac)}
.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ac);font-weight:700}
.card,.kc,.tabs,.tw,.call{box-shadow:0 1px 2px rgba(22,40,42,.05)}
.kc{border-top:2px solid var(--acd)}
h1{font-size:22px;margin:6px 0 6px}h2{font-size:16px;margin:4px 0 10px}h3{font-size:13px;margin-bottom:6px}
.sub{color:var(--tx2);font-size:12px;line-height:1.5}
.cap{color:var(--tx3);font-size:10.5px;margin-top:6px;line-height:1.45}
.bar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:16px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--brd)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:3px}
.tab{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--tx2);border:none;background:none;font-family:var(--ff)}
.tab:hover{color:var(--tx)}.tab.on{background:var(--ac);color:#fff}
.sp{flex:1}
.fg{display:flex;flex-direction:column;gap:3px}.fg label{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);font-weight:700}
select,input[type=text],input[type=number],input[type=date]{background:var(--s2);border:1px solid var(--brd);color:var(--tx);padding:7px 9px;border-radius:7px;font-family:var(--ff);font-size:12px;min-width:120px}
input[type=number]{min-width:70px;width:80px}
.btn{background:var(--s2);border:1px solid var(--brd);color:var(--tx2);padding:7px 12px;border-radius:7px;font-family:var(--ff);font-size:12px;cursor:pointer}
.btn:hover{color:var(--tx);border-color:var(--ac)}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kc{background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:14px 16px}
.kv{font-family:var(--mono);font-size:21px;font-weight:600}.kl{font-size:10.5px;color:var(--tx2);margin-top:5px;line-height:1.4}
.kd{font-size:10.5px;margin-top:6px;line-height:1.5;color:var(--tx2)}
.ok{color:var(--g)}.bad{color:var(--r)}.mid{color:var(--a)}.neu{color:var(--tx2)}
.call{border:1px solid var(--brd);border-left:3px solid var(--a);background:var(--s1);border-radius:8px;padding:12px 14px;margin-bottom:18px;line-height:1.55}
.call.info{border-left-color:var(--b)}.call b{display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:20px}
.card{background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:16px}
.ch{position:relative;height:280px}
.sec{margin-bottom:22px}
.tw{overflow:auto;border:1px solid var(--brd);border-radius:10px;max-height:640px}
table{width:100%;border-collapse:collapse;font-size:11.5px}thead{background:var(--s2);position:sticky;top:0;z-index:2}
th{padding:8px;text-align:right;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);border-bottom:1px solid var(--brd);white-space:nowrap}
th.sort{cursor:pointer}th.sort:hover{color:var(--tx)}th.cur{color:var(--ac)}
td{padding:7px 8px;border-bottom:1px solid var(--brd);font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.txt{font-family:var(--ff);text-align:left}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--s2)}tr.sel td{background:var(--acd)}
tr.grp td{background:var(--s2);font-family:var(--ff);font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-family:var(--ff);font-weight:600}
.pill.ok{background:var(--gd)}.pill.mid{background:var(--ad)}.pill.bad{background:var(--rd)}.pill.neu{background:var(--s2)}
.meta p{font-size:12px;color:var(--tx2);line-height:1.55;margin-bottom:8px}.meta h3{margin-top:14px}
.meta li{font-size:12px;color:var(--tx2);line-height:1.55;margin-left:18px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:1000px){.kg{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style>
</head>

const fmtN = (n, d = 0) => { if (!isFinite(n)) return "—"; const [e, f] = Math.abs(n).toFixed(d).split("."); return (n < 0 && +n.toFixed(d) !== 0 ? "-" : "") + e.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (f ? "," + f : ""); };

const addDays = (iso, n) => new Date(Date.parse(iso + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const monday = iso => { const x = new Date(iso + "T12:00:00Z"); return addDays(iso, -((x.getUTCDay() + 6) % 7)); };
const dow = iso => new Date(iso + "T12:00:00Z").getUTCDay();
function isoWeek(d) { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() - (x.getUTCDay() + 6) % 7 + 3); const t = new Date(Date.UTC(x.getUTCFullYear(), 0, 4)); t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7 + 3); return 1 + Math.round((x - t) / 6048e5); }

const ddmmyy = d => ddmm(d) + "/" + d.slice(2, 4);
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const inGrp = d => st.grp === "all" || DR[d].g === st.grp;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const SIDES = { in: 0, res: 1, tot: 2 }, SIDE_N = { in: "In-app", res: "Reservas + logística", tot: "Total" }, SIDE_C = { in: C.b, res: C.p, tot: C.g };

// ---------- acumuladores: A = { L: [línea][asig, fin, gan, gmv, of, ac, cx], h }
const newA = () => ({ L: LIN.map(() => [0, 0, 0, 0, 0, 0, 0]), h: 0 });
function sides(A) {
  const i = [0, 0, 0, 0, 0, 0, 0], r = [0, 0, 0, 0, 0, 0, 0], t = [0, 0, 0, 0, 0, 0, 0];
  for (let l = 0; l < LIN.length; l++) { const g = SIDE_OF[l] ? r : i; for (let k = 0; k < 7; k++) g[k] += A.L[l][k]; }
  for (let k = 0; k < 7; k++) t[k] = i[k] + r[k];
  return [i, r, t];
}
function aggBy(kf) {   // kf(fechaISO) -> clave | null ; devuelve Map clave -> Map conductor -> A
  const out = new Map();
  const get = (k, d) => { let m = out.get(k); if (!m) out.set(k, m = new Map()); let A = m.get(d); if (!A) m.set(d, A = newA()); return A; };
  for (const r of DATA.R) { const k = kf(DIAS[r[0]]); if (k === null) continue; const L = get(k, r[1]).L[r[2]]; for (let j = 0; j < 7; j++) L[j] += r[3 + j]; }
  for (const r of DATA.H) { const k = kf(DIAS[r[0]]); if (k === null) continue; get(k, r[1]).h += r[2]; }

}
const aggRange = (a, b) => aggBy(d => d >= a && d <= b ? "x" : null).get("x") || new Map();
const KF = { dia: d => d, sem: monday, mes: d => d.slice(0, 7) };
const bc = {};
function buckets(kind) {
  if (bc[kind]) return bc[kind];
  const map = aggBy(KF[kind]), nd = new Map();
  for (const d of DIAS) { const k = KF[kind](d); nd.set(k, (nd.get(k) || 0) + 1); if (!map.has(k)) map.set(k, new Map()); }
  return bc[kind] = { keys: [...map.keys()].sort(), map, nd };
}
function ctxOf(m) {   // totales del grupo filtrado
  const c = { in: Array(7).fill(0), res: Array(7).fill(0), tot: Array(7).fill(0), h: 0, n: [0, 0, 0], nd: 0 };
  for (const [d, A] of m) {
    if (!inGrp(d)) continue;
    const s = sides(A);
    for (let k = 0; k < 7; k++) { c.in[k] += s[0][k]; c.res[k] += s[1][k]; c.tot[k] += s[2][k]; }

}
// índices del arreglo de lado: 0 asig, 1 fin, 2 gan, 3 gmv, 4 ofertas, 5 aceptadas, 6 cancel conductor
const MET = [
  { k: "fin", n: "Viajes finalizados", f: (c, s) => c[s][1], fmt: d0, add: true },
  { k: "asig", n: "Viajes asignados", f: (c, s) => c[s][0], fmt: d0, add: true },
  { k: "share", n: "% in-app sobre el total de viajes finalizados", only: ["tot"], f: c => pct(c.in[1], c.tot[1]), fmt: fP, rate: true },
  { k: "ar", n: "Aceptación in-app", only: ["in"], f: c => pct(c.in[5], c.in[4]), fmt: fP, rate: true },
  { k: "cxr", n: "Cancelación del conductor in-app (s/ aceptadas)", only: ["in"], f: c => pct(c.in[6], c.in[5]), fmt: fP, rate: true, good: false },
  { k: "finr", n: "Finalización in-app (finalizados / asignados)", only: ["in"], f: c => pct(c.in[1], c.in[0]), fmt: fP, rate: true },
  { k: "h", n: "Horas en línea", only: ["tot"], f: c => c.h, fmt: d1 },
  { k: "rph", n: "Viajes finalizados por hora en línea (RPH)", only: ["in", "tot"], f: (c, s) => c.h > 0 ? c[s][1] / c.h : NaN, fmt: d2 },
  { k: "eph", n: "Ganancia por hora en línea (EPH)", only: ["in", "tot"], f: (c, s) => c.h > 0 ? c[s][2] / c.h : NaN, fmt: fGs },
  { k: "asp", n: "Ganancia por viaje finalizado", f: (c, s) => c[s][1] > 0 ? c[s][2] / c[s][1] : NaN, fmt: fGs },
  { k: "gan", n: "Ganancia del conductor (viajes finalizados)", f: (c, s) => c[s][2], fmt: fGs, add: true },
  { k: "act", n: "Conductores con ≥ 1 viaje finalizado", f: (c, s) => c.n[SIDES[s]], fmt: d0 },
];
const metSides = m => m.only || ["in", "res", "tot"];

// ---------- período
function periodo() {
  const first = DIAS[0], ult = ULT, lastSun = dow(ult) === 0 ? ult : addDays(monday(ult), -1);
  let a, b;
  if (st.per === "sem") { b = lastSun; a = addDays(b, -6); }
  else if (st.per === "curso") { a = monday(ult); b = ult; }
  else if (st.per === "4sem") { b = lastSun; a = addDays(b, -27); }
  else if (st.per === "mes") { a = ult.slice(0, 8) + "01"; b = ult; }
  else if (st.per === "mesant") { const pm = addDays(ult.slice(0, 8) + "01", -1); a = pm.slice(0, 8) + "01"; b = pm; }
  else if (st.per === "todo") { a = first; b = ult; }
  else { a = st.from || first; b = st.to || ult; }
  if (a < first) a = first; if (b > ult) b = ult; if (a > b) a = b;
  const n = DI.get(b) - DI.get(a) + 1, pb = addDays(a, -1), pa = addDays(pb, -(n - 1));

}
const PERS = [["sem", "Última semana completa"], ["curso", "Semana en curso"], ["4sem", "Últimas 4 semanas completas"], ["mes", "Mes en curso"], ["mesant", "Mes anterior"], ["todo", "Todo el histórico"], ["custom", "Personalizado"]];
const perTxt = P => `${ddmmyy(P.a)} → ${ddmmyy(P.b)} (${P.n} día${P.n > 1 ? "s" : ""})`;

// ---------- reglas del control (Tope de reservas vs viajes in-app)
const DIST = { C: ["ok", "Controlado"], A: ["mid", "Ajustar"], S: ["bad", "Sin viajes in-app"], I: ["neu", "Inactivo"] };
function classify(F, E, days, ofIn, acIn, cxIn, fraude) {
  const tope = days / 7 * st.p.tope, minIn = days / 7 * st.p.minIn;

  const ar = pct(acIn, ofIn), cx = pct(cxIn, acIn);
  let act;
  if (fraude) act = "Salir (fraude)";
  else if (dist === "I") act = "Inactivo";
  else if (E > tope) act = "Ajustar tope";
  else if (F <= E || F < minIn) act = "Empujar in-app";
  else if (ofIn >= 5 && (ar < st.p.arMin || cx > st.p.cxMax)) act = "Mejorar calidad in-app";

}
const ACTS = [["Salir (fraude)", "bad"], ["Ajustar tope", "bad"], ["Empujar in-app", "mid"], ["Mejorar calidad in-app", "mid"], ["OK", "ok"], ["Inactivo", "neu"]];
const ACT_C = Object.fromEntries(ACTS);
function fraudSet() {
  const s = new Set(), lim = addDays(ULT, -29);

}
function driverRows(P) {

    const F = s[0][1], E = s[1][1], k = classify(F, E, P.n, s[0][4], s[0][5], s[0][6], fr.has(d));
    out.push({ d, id: x.id, g: x.g, h: A.h, inAs: s[0][0], inFin: F, resFin: E, inGan: s[0][2], resGan: s[1][2],

// ---------- gráficos

// ---------- RESUMEN

// ---------- EVOLUCIÓN
function vEvo() {
  const B = buckets(st.kind), keys = B.keys, mm = MET.find(x => x.k === st.met) || MET[0], cx = keys.map(k => ctxOf(B.map.get(k))), lab = keys.map(k => bLabel(st.kind, k, B));
  const ss = metSides(mm);
  const ds = mm.add && ss.length === 3
    ? [Bs(SIDE_N.in, cx.map(c => mm.f(c, "in")), SIDE_C.in, { stack: "s" }), Bs(SIDE_N.res, cx.map(c => mm.f(c, "res")), SIDE_C.res, { stack: "s" })]
    : ss.map(s => L(SIDE_N[s], cx.map(c => mm.f(c, s)), SIDE_C[s]));
  const suf = mm.rate ? "%" : "";
  const sel = (id, opts, v, fn) => `<div class="fg"><label>${id}</label><select onchange="${fn}(this.value)">${opts.map(([k, t]) => `<option value="${k}"${k === v ? " selected" : ""}>${t}</option>`).join("")}</select></div>`;
  const heads = ["Período", "In-app fin.", "Reservas + log. fin.", "% in-app", "Aceptación in-app", "Cancel. in-app", "Finaliz. in-app", "Horas", "RPH in-app", "EPH total", "Cond. in-app", "Cond. reservas"];
  const trs = keys.map((k, i) => { const c = cx[i]; return [bLabel(st.kind, k, B), fmtN(c.in[1]), fmtN(c.res[1]), fP(pct(c.in[1], c.tot[1]), 0), fP(pct(c.in[5], c.in[4])), fP(pct(c.in[6], c.in[5])), fP(pct(c.in[1], c.in[0])), fmtN(c.h), c.h > 0 ? d2(c.in[1] / c.h) : "—", c.h > 0 ? fGs(c.tot[2] / c.h) : "—", fmtN(c.n[0]), fmtN(c.n[1])]; }).reverse();
  return `<div class="row">${sel("Granularidad", [["dia", "Día"], ["sem", "Semana"], ["mes", "Mes"]], st.kind, "setKind")}${sel("Métrica", MET.map(x => [x.k, x.n]), st.met, "setMet")}</div>
  <div class="card sec"><h3>${mm.n} · ${st.kind === "dia" ? "por día" : st.kind === "sem" ? "por semana" : "por mes"}</h3>${chart("e1", mixCfg(lab, ds, suf, { beginAtZero: true }, null, !!(mm.add && ss.length === 3)))}<div class="cap">Se respeta el filtro de grupo. * = período parcial (todavía no terminó). In-app = todo lo que no es reserva · Reservas + logística = viajes WEB-SCHEDULED. Horas = horas en línea (no existen para viajes asignados fuera de la app).</div></div>
  <div class="sec"><h2>Detalle por período</h2>${tabla(heads, trs)}</div>`;
}

// ---------- CONTROL
let lastRows = [];
const CT = [
  ["id", "Conductor", r => esc(r.id), "txt"], ["g", "Tipo", r => r.g, "txt"], ["h", "Horas", r => d1(r.h)],
  ["inFin", "In-app fin.", r => fmtN(r.inFin)], ["resFin", "Reservas + log. fin.", r => fmtN(r.resFin)], ["share", "% in-app", r => fP(r.share, 0)],
  ["tope", "Tope reservas", r => fmtN(r.tope, 1)], ["prio", "Acción sugerida", r => pill(ACT_C[r.act], r.act), "txt"], ["dist", "Distribución", r => pill(DIST[r.dist][0], DIST[r.dist][1]), "txt"],
  ["ar", "Aceptación in-app", r => fP(r.ar, 0)], ["cx", "Cancel. in-app", r => fP(r.cx, 0)], ["finr", "Finaliz. in-app", r => fP(r.finr, 0)],
  ["rph", "RPH in-app", r => isFinite(r.rph) ? d2(r.rph) : "—"], ["eph", "EPH total", r => fGs(r.eph)],
  ["prevIn", "In-app previo", r => fmtN(r.prevIn)],
];
function ctlTable() {
  const P = periodo(); let rows = driverRows(P);
  const q = st.q.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.id.toLowerCase().includes(q));
  if (st.fAct !== "all") rows = rows.filter(r => r.act === st.fAct || r.dist === st.fAct);
  const k = st.sort.k, dir = st.sort.dir;
  rows.sort((a, b) => { const x = a[k], y = b[k]; const nx = typeof x === "number" && !isFinite(x), ny = typeof y === "number" && !isFinite(y); if (nx !== ny) return nx ? 1 : -1; return (x < y ? -1 : x > y ? 1 : 0) * dir || a.inFin - b.inFin || a.d - b.d; });
  lastRows = rows;
  const head = CT.map(c => `<th class="sort${st.sort.k === c[0] ? " cur" : ""}" onclick="setSort('${c[0]}')">${c[1]}${st.sort.k === c[0] ? (st.sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const body = rows.map(r => `<tr class="clk" onclick="goDrv(${r.d})">${CT.map(c => `<td${c[3] ? ' class="txt"' : ""}>${c[2](r)}</td>`).join("")}</tr>`).join("");
  return `<div class="cap" style="margin:0 0 8px">${rows.length} conductores · ${perTxt(P)} · tope prorrateado = ${st.p.tope} × días / 7 · clic en una fila para ver el detalle del conductor.</div><div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function vControl() {
  const num = (k, lbl) => `<div class="fg"><label>${lbl}</label><input type="number" value="${st.p[k]}" min="0" onchange="setP('${k}',this.value)"></div>`;
  const acts = [["all", "Todas"], ...ACTS.map(([a]) => [a, a]), ["C", "Dist.: Controlado"], ["A", "Dist.: Ajustar"], ["S", "Dist.: Sin viajes in-app"]];
  return `<div class="call info"><b>Cómo se lee</b>Un conductor del grupo debería hacer más viajes in-app que de reservas / logística (los viajes de reserva son un beneficio) y no superar el tope semanal de reservas. <b style="display:inline">Distribución</b> = Controlado / Ajustar / Sin viajes in-app / Inactivo (misma regla que el "Tope VF" del Google Sheets). <b style="display:inline">Acción</b> = qué hacer: Salir (fraude nivel 2+ en 30 días), Ajustar tope (reservas sobre el tope), Empujar in-app (reservas ≥ in-app o in-app por debajo del mínimo semanal), Mejorar calidad in-app (aceptación o cancelación fuera de umbral), OK.</div>
  <div class="row">
    ${num("tope", "Tope reservas / semana")}${num("minIn", "Mín. in-app / semana")}${num("arMin", "Aceptación mín. (%)")}${num("cxMax", "Cancelación máx. (%)")}
    <div class="fg"><label>Filtrar</label><select onchange="setAct(this.value)">${acts.map(([k, t]) => `<option value="${k}"${k === st.fAct ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="fg"><label>Buscar conductor</label><input type="text" id="fQ" value="${esc(st.q)}" oninput="setQ(this.value)" placeholder="${PUB ? "ej. D012" : "ID del conductor"}"></div>
    <button class="btn" onclick="dlCsv()">Descargar CSV</button>
  </div>
  <div id="ctlBody">${ctlTable()}</div>`;
}

// ---------- DETALLE DE CONDUCTOR
function vDriver() {
  const P = periodo();
  if (st.drv === null) {
    const r = driverRows(P).sort((a, b) => b.inFin + b.resFin - a.inFin - a.resFin)[0];
    st.drv = r ? r.d : 0;
  }
  const d = st.drv, x = DR[d];
  const sel = `<div class="fg"><label>Conductor</label><select onchange="goDrv(+this.value)">${DR.map((y, i) => `<option value="${i}"${i === d ? " selected" : ""}>${esc(y.id)} · ${y.g}</option>`).join("")}</select></div>`;
  const B = buckets("sem"), keys = B.keys, lab = keys.map(k => bLabel("sem", k, B));
  const S = keys.map(k => { const A = B.map.get(k).get(d) || newA(); return { s: sides(A), h: A.h, days: B.nd.get(k) }; });
  const cl = S.map(o => classify(o.s[0][1], o.s[1][1], o.days, o.s[0][4], o.s[0][5], o.s[0][6], false));
  const ch1 = mixCfg(lab, [Bs("In-app", S.map(o => o.s[0][1]), C.b, { yAxisID: "y", stack: "s" }), Bs("Reservas + logística", S.map(o => o.s[1][1]), C.p, { yAxisID: "y", stack: "s" }), L("% in-app", S.map(o => pct(o.s[0][1], o.s[2][1])), C.g, { yAxisID: "y2" }), L("Tope de reservas", S.map(o => o.days / 7 * st.p.tope), C.r, { yAxisID: "y", stack: "t", borderDash: [5, 4], pointRadius: 0 })], "", { beginAtZero: true }, { beginAtZero: true, suffix: "%", max: 100 }, true);
  const ch2 = mixCfg(lab, [L("Aceptación in-app", S.map(o => pct(o.s[0][5], o.s[0][4])), C.g), L("Cancelación conductor", S.map(o => pct(o.s[0][6], o.s[0][5])), C.r), Bs("Horas en línea", S.map(o => o.h), C.b, { yAxisID: "y2", backgroundColor: "#2563eb33" })], "%", { beginAtZero: true, max: 100 }, { beginAtZero: true, grid: { drawOnChartArea: false } });
  const rows = keys.map((k, i) => { const o = S[i], c = cl[i]; return [bLabel("sem", k, B), d1(o.h), fmtN(o.s[0][4]), fmtN(o.s[0][1]), fmtN(o.s[1][1]), fP(pct(o.s[0][1], o.s[2][1]), 0), fP(c.ar, 0), fP(c.cx, 0), fGs(o.s[0][2]), fGs(o.s[1][2]), pill(DIST[c.dist][0], DIST[c.dist][1])]; }).reverse();
  const fr = DATA.F.filter(f => f[0] === d && f[2] >= 2).map(f => `${ddmmyy(f[1])} (nivel ${f[2]})`);
  return `<div class="row">${sel}</div>
  <div class="call info"><b>${esc(x.id)} · tipo ${x.g}</b>Alertas de fraude confirmadas con nivel 2+: ${fr.length ? fr.join(", ") : "ninguna en los últimos 120 días"}. Los umbrales del control (tope ${st.p.tope} reservas por semana) se editan en "Control del grupo".</div>
  <div class="g2">${card("Viajes finalizados por semana", chart("d1", ch1), "Barras: in-app vs reservas + logística · línea verde: % in-app (eje der.) · línea roja: tope semanal de reservas.")}
  ${card("Calidad in-app y horas", chart("d2", ch2), "Aceptación y cancelación (%) · barras: horas en línea (eje der.).")}</div>
  <div class="sec"><h2>Detalle semanal</h2>${tabla(["Semana", "Horas", "Ofertas in-app", "In-app fin.", "Reservas + log. fin.", "% in-app", "Aceptación", "Cancel.", "Ganancia in-app", "Ganancia reservas", "Distribución"], rows)}</div>`;
}

// ---------- METODOLOGÍA
function vMetodo() {
  return `<div class="card meta">
  <h2>Qué es este dash</h2>
  <p>Seguimiento del grupo de conductores seleccionados para hacer viajes de reserva / logística (B2B), que pagan mucho más que un viaje in-app. La idea es que sigan aportando viajes in-app y cuiden su share, en vez de hacer solo viajes de reserva: los viajes de reserva son un beneficio, los viajes in-app son lo que muv necesita. El dash sirve para decidir a quién empujar con comunicaciones, a quién ajustar y a quién sacar del grupo.</p>
  <h3>Datos</h3>
  <ul><li>Fuente: data lake de muv (Athena), tabla de viajes por línea de negocio, ofertas a conductores, horas en línea y alertas de fraude. Datos hasta el ${DATA.fechaDatos} (los días parciales no se incluyen). ${DR.length} conductores en el grupo.</li>
  <li><b>Reserva</b> = viaje con fuente de carga WEB-SCHEDULED (viaje programado desde la web: B2B Reservas y Logística). <b>In-app</b> = todo lo que no es reserva (B2C y B2B in-app). La línea de negocio (B2C, B2B in-app, B2B Reservas, Logística) es solo el detalle.</li>
  <li>Los viajes marcados como fraude en las alertas confirmadas se excluyen de todas las métricas.</li>
  <li>Aceptación, cancelación y ofertas se miden solo in-app (los viajes de reserva se asignan, no se ofrecen). En el data lake los viajes de reserva solo figuran como finalizados: la finalización de reservas no se puede medir como tasa.</li>
  <li>Horas en línea: horas conectadas en la app (sin duplicados). Los viajes de reserva se asignan fuera de la app, así que las horas explican sobre todo la oferta in-app.</li>
  <li>Ganancia = ganancia del conductor en viajes finalizados, sin bonos. EPH = ganancia / horas en línea. RPH = viajes finalizados / horas en línea.</li></ul>
  <h3>Regla de distribución y acciones</h3>
  <ul><li><b>Distribución</b> (mismo criterio que la hoja "Tope VF" del Google Sheets): Inactivo = sin viajes; Sin viajes in-app = hizo reservas / logística pero ningún viaje in-app; Controlado = más viajes in-app que de reservas / logística y reservas dentro del tope; Ajustar = el resto.</li>
  <li><b>Tope de reservas</b>: ${st.p.tope} viajes de reserva + logística por semana, prorrateado por días en períodos parciales. Editable en "Control del grupo".</li>
  <li><b>Acción sugerida</b> (una por conductor, por prioridad): Salir (alerta de fraude confirmada con nivel 2+ en los últimos 30 días) &gt; Ajustar tope &gt; Empujar in-app (reservas ≥ in-app, o in-app por debajo del mínimo semanal) &gt; Mejorar calidad in-app (aceptación o cancelación fuera de umbral, con al menos 5 ofertas) &gt; OK.</li>
  <li>Las acciones son una guía para priorizar, no una decisión automática: la decisión final es del equipo.</li></ul>
  <h3>Períodos</h3>
  <p>Semanas lunes a domingo (S = semana ISO). El selector de período define el resumen y el control; "Evolución" muestra todo el histórico por día, semana o mes. El período previo para las variaciones es el de igual duración inmediatamente anterior. El filtro "Grupo" separa los conductores según el tipo con el que entraron al seguimiento (Reservas o B2C).</p>
  ${PUB ? "" : PRIV.prog}
  <h3>Limitaciones</h3>
  <ul><li>Otros criterios de selección del grupo (por ejemplo calificación o tipo de auto) no están en este dash.</li>
  <li>La lista de conductores se mantiene a mano (renovación mensual del grupo).</li>
  ${PUB ? "" : `<li>${PRIV.idNote}</li>`}</ul>
  </div>`;
}

// ---------- navegación
const TABS = [["resumen", "Resumen"], ["evo", "Evolución"], ["control", "Control del grupo"], ["driver", "Por conductor"], ["metodo", "Metodología"]];
function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, t]) => `<button class="tab${st.tab === k ? " on" : ""}" onclick="setTab('${k}')">${t}</button>`).join("");
  const P = periodo();
  document.getElementById("wFrom").style.display = document.getElementById("wTo").style.display = st.per === "custom" ? "" : "none";
  document.getElementById("subtitle").innerHTML = `Datos hasta el ${DATA.fechaDatos} · ${DR.length} conductores · período: ${perTxt(P)}`;
  const v = { resumen: vResumen, evo: vEvo, control: vControl, driver: vDriver, metodo: vMetodo }[st.tab];
  document.getElementById("body").innerHTML = v();
  mountCharts();
}
function setTab(t) { st.tab = t; render(); }
function setKind(v) { st.kind = v; render(); }
function setMet(v) { st.met = v; render(); }
function setP(k, v) { st.p[k] = Math.max(0, +v || 0); render(); }
function setAct(v) { st.fAct = v; render(); }
function setQ(v) { st.q = v; document.getElementById("ctlBody").innerHTML = ctlTable(); }
function setSort(k) { st.sort = { k, dir: st.sort.k === k ? -st.sort.dir : (["id", "g"].includes(k) ? 1 : -1) }; render(); }
function goDrv(d) { st.drv = d; st.tab = "driver"; render(); }
function dlCsv() {
  const P = periodo(), head = ["conductor", "tipo", "periodo", "horas", "in_app_fin", "reservas_log_fin", "pct_in_app", "tope_reservas", "distribucion", "aceptacion_in_app", "cancelacion_in_app", "finalizacion_in_app", "accion"];
  const f = v => isFinite(v) ? String(+v.toFixed(2)) : "";
  const lines = [head.join(",")].concat(lastRows.map(r => [r.id, r.g, perTxt(P).replace(/,/g, ""), f(r.h), r.inFin, r.resFin, f(r.share), f(r.tope), DIST[r.dist][1], f(r.ar), f(r.cx), f(r.finr), r.act].join(",")));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" })); a.download = "control_reservas.csv"; a.click();
}

// ---------- init
document.getElementById("eyebrow").textContent = PUB ? "muv · supply · seguimiento de grupo de conductores" : PRIV.eyebrow;
const fPer = document.getElementById("fPer"), fGrp = document.getElementById("fGrp");
fPer.innerHTML = PERS.map(([k, t]) => `<option value="${k}">${t}</option>`).join("");
const GRPS = [...new Set(DR.map(x => x.g))].sort();
fGrp.innerHTML = [`<option value="all">Todos (${DR.length})</option>`, ...GRPS.map(g => `<option value="${g}">${g} (${DR.filter(x => x.g === g).length})</option>`)].join("");
fPer.onchange = e => { st.per = e.target.value; render(); };
fGrp.onchange = e => { st.grp = e.target.value; render(); };
document.getElementById("fFrom").value = DIAS[0]; document.getElementById("fTo").value = ULT; st.from = DIAS[0]; st.to = ULT;
document.getElementById("fFrom").min = document.getElementById("fTo").min = DIAS[0];
document.getElementById("fFrom").max = document.getElementById("fTo").max = ULT;
document.getElementById("fFrom").onchange = e => { st.from = e.target.value; render(); };
document.getElementById("fTo").onchange = e => { st.to = e.target.value; render(); };
if (typeof location !== "undefined" && TABS.some(t => t[0] === location.hash.slice(1))) st.tab = location.hash.slice(1);   // enlace directo: #control, #evo...
render();
</script>
</body>
</html>
